name: Kobo qt5 device build

# Device-verification pipeline for the FB2/Russian fork.
# Automatically builds only the Qt5 Kobo package (firmware 4.38+), which can be
# sideloaded onto a physical Kobo for on-device testing. The Qt6 and Android
# targets are excluded from pushes. An explicit manual input permits one-off
# Qt6 verification; normal development remains Qt5-first.
on:
  push:
    branches: [arena/9e626d86-kobalt-ru]
    # Manual diagnostic/screenshot uploads and documentation do not change binaries.
    # Mixed source + documentation pushes still build; workflow_dispatch is unaffected.
    paths-ignore:
      - 'doc/**'
      - 'test & diagnostic/**'
      - 'tests/manual/screenshots/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_qt6_once:
        description: 'One-off Qt6 package instead of the normal Qt5/native run'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: kobalt-qt5-device-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker
  # Fork-only enablement: the generic mechanism defaults to empty, so upstream
  # builds keep the stock About page; the fork's CI labels its builds explicitly.
  KOBALT_FORK_NAME: kobalt_ru

jobs:
  footnote-regressions:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.build_qt6_once) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qt6-once]'))) }}
    name: EPUB and FB2 engine regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run focused native checks in the pinned Linux SDK
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-footnotes.log"
          set +e
          (
            set -euo pipefail
            image=$(sh platforms/sdk-image.sh linux)
            docker pull "$image"
            cache=$(cmake -P dependencies/cache.cmake)
            mkdir -p "$cache"
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              --volume "$PWD:/work" --volume "$cache:/dependency-cache" \
              --workdir /work/platforms/desktop "$image" bash -euc '
                cmake --preset linux -DKOBALT_FORK_NAME=kobalt_ru -DKOBALT_DEPENDENCY_CACHE=/dependency-cache -DKOBALT_DEPENDENCY_JOBS=4
                cmake --build ../../build/desktop-linux --parallel 4 --target kobalt-desktop-tests kobalt-links-tests kobalt-fb2-tests kobalt-comics-tests kobalt-chapter-progress-tests kobalt-header-footer-tests kobalt-document-cache-tests kobalt-appearance-settings-tests kobalt-ui-tests kobalt-strings-locale-tests kobalt-reader-lifecycle-tests kobalt-shutdown-tests -- -k 0
                ctest --preset linux --output-on-failure -R "^(platform\.shutdown|engine\.(links|fb2|comics|document-cache)|model\.(appearance-settings|header-footer|chapter-progress|strings-locale)|component\.ui|desktop\.(lazyAppearance|settings.*|libraryAbout|chapterGroups|buttonMapping.*|headerFooterSizes|progressStripMirrors|advancedText|globalLayout)|lifecycle\.(readerStandbySetting|appearance.*|uneditedPanelTransitions|overflowClosesCurrentPanel))$"
                QT_QPA_PLATFORM=offscreen cmake \
                  -DTEST_EXECUTABLE=/work/build/desktop-linux/kobalt-links-tests \
                  "-DTEST_ARGUMENTS=--publisher-notes;/work/tests/manual/books/publisher/Кокаиновые+короли.epub" \
                  -DTEST_TIMEOUT=180 -DTEST_TMP_ROOT=/work/build/desktop-linux/test-tmp \
                  -P /work/platforms/desktop/run-test.cmake
              '
          ) >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Native footnote checks failed'
              echo '```'
              tail -150 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -40 "$log"
          if [ "$status" -ne 0 ]; then
            # QtTest uses FAIL!, not FAIL<space>. Emit each failure with its
            # comparison/source context; do not lose later failures behind the
            # first launcher's generic exit code or a pipefail/SIGPIPE from head.
            # One multiline annotation also avoids GitHub's ten-errors-per-step cap.
            awk '
              /error:|Error|FAILED|FAIL|FATAL|not found|No rule|ninja:/ { context = 5 }
              context > 0 && count < 100 {
                gsub(/%/, "%25"); gsub(/\r/, "%0D")
                report = report $0 "%0A"
                context--; count++
              }
              END { if (count) print "::error::" report }
            ' "$log"
          fi
          exit "$status"
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: footnote-native-results
          path: build/desktop-linux/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  build-qt5:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.build_qt6_once) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qt6-once]'))) }}
    name: Build Kobalt-qt5 for device testing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Offline release checks
        run: |
          log="$RUNNER_TEMP/offline-checks.log"
          if ! bash platforms/ci/test.sh >"$log" 2>&1; then
            {
              echo "### Offline release checks failed"
              echo
              echo '```'
              tail -120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "Error|error|FATAL" "$log" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Build and verify Kobalt-qt5 package
        run: |
          log="$RUNNER_TEMP/build-qt5.log"
          set +e
          bash platforms/ci/build.sh qt5 >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # The step summary is readable through the check-runs API, which
            # keeps the failure diagnosable when archived logs are unreachable.
            {
              echo "### Kobalt-qt5 build failed"
              echo
              echo '```'
              tail -150 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|Error|FAILED|fatal" "$log" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Validate package contents
        run: |
          set -euo pipefail
          zip=build/release/Kobalt-qt5.zip
          test -f "$zip"
          test ! -e build/release/Kobalt-qt6.zip
          test -f build/release/build-qt5.json
          python3 - "$zip" <<'PY'
          import sys, zipfile
          archive = zipfile.ZipFile(sys.argv[1])
          names = set(archive.namelist())
          required = {
              ".kobo/KoboRoot.tgz",
              ".adds/kobalt/assets/manifest.json",
          }
          missing = required - names
          if missing:
              sys.exit(f"Missing package members: {sorted(missing)}")
          if any(name.startswith("/") or ".." in name.split("/") for name in names):
              sys.exit("Unsafe package member path")
          print(f"PASS: {len(names)} package members, all required paths present")
          PY
          unzip -l "$zip"

      - name: Write device verification summary
        run: |
          set -euo pipefail
          metadata=build/release/build-qt5.json
          version=$(jq -r '.version' "$metadata")
          commit=$(jq -r '.commit' "$metadata")
          sha=$(jq -r '.sha256' "$metadata")
          {
              echo "## Kobalt-qt5 — сборка для проверки на устройстве"
              echo
              echo "- Версия: \`$version\`"
              echo "- Коммит: \`$commit\`"
              echo "- SHA-256 \`Kobalt-qt5.zip\`: \`$sha\`"
              echo "- Артефакт: **Kobalt-qt5-device** (\`Kobalt-qt5.zip\` + метаданные сборки)"
              echo
              echo "### Установка на Kobo (прошивка 4.38–4.46, Qt5)"
              echo "1. Скачать артефакт **Kobalt-qt5-device** и распаковать \`Kobalt-qt5.zip\`."
              echo "2. Подключить Kobo по USB; скопировать папку \`.adds\` в корень диска Kobo, затем папку \`.kobo\` (слияние, без замены сторонних модов)."
              echo "3. Безопасно извлечь устройство и дождаться установки \`KoboRoot.tgz\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Kobalt-qt5-device
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-qt6-once:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_qt6_once) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qt6-once]')) }}
    name: One-off Kobo Qt6 package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline checks, Qt6 adapters and package
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qt6-once.log"
          set +e
          (
            set -euo pipefail
            bash platforms/ci/test.sh
            bash platforms/ci/build.sh qt6
          ) >"$log" 2>&1
          status=$?
          set -e
          tail -60 "$log"
          if [ "$status" -ne 0 ]; then
            { echo '### One-off Qt6 failure'; echo '```'; tail -150 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            awk '
              /error:|Error|FAILED|FAIL|FATAL|not found|No rule|ninja:/ { context = 5 }
              context > 0 && count < 100 {
                gsub(/%/, "%25"); gsub(/\r/, "%0D")
                report = report $0 "%0A"; context--; count++
              }
              END { if (count) print "::error::" report }
            ' "$log"
          fi
          exit "$status"
      - name: Validate Qt6 archive and record checksum
        shell: bash
        run: |
          set -euo pipefail
          zip=build/release/Kobalt-qt6.zip
          metadata=build/release/build-qt6.json
          test -f "$zip"
          test ! -e build/release/Kobalt-qt5.zip
          test "$(jq -r .target "$metadata")" = qt6
          test "$(jq -r .commit "$metadata")" = "$GITHUB_SHA"
          expected=$(jq -r .sha256 "$metadata")
          echo "$expected  $zip" | sha256sum -c -
          python3 - "$zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              required = {".kobo/Kobo.tgz", ".adds/kobalt/assets/manifest.json"}
              if not required <= names or ".kobo/KoboRoot.tgz" in names:
                  sys.exit("Missing Qt6 members or unexpected Qt5 installer")
              if any(n.startswith("/") or ".." in n.split("/") for n in names):
                  sys.exit("Unsafe package member path")
          PY
          {
            echo '## One-off Kobalt Qt6 build'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- ZIP SHA-256: \`$expected\`"
            echo '- For Qt6-based Kobo firmware, not Qt5 firmware 4.x.'
            echo '- Adapter/package checks do not replace physical device testing.'
            echo '- Normal automatic development and checks remain Qt5.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Kobalt-qt6-once
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

name: Kobo qt5 device build (disabled legacy)

# Quarantined: the user reports that these packages return to Nickel rather
# than starting Kobalt on hardware. A green compile/package CI is insufficient.
# Previous implementation is preserved in Git history at 430112ee.
# No push/PR trigger; even a manual dispatch must not build/publish this package.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-device-build-disabled:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Legacy device package quarantined; hardware startup is not validated."

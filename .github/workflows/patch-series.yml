name: Ordered patch series
on:
  push:
    paths:
      - 'platforms/patch-series/**'
      - 'platforms/control-beta10/ru.patch'
      - '.github/workflows/patch-series.yml'
  pull_request:
    paths:
      - 'platforms/patch-series/**'
      - 'platforms/control-beta10/ru.patch'
      - '.github/workflows/patch-series.yml'
  workflow_dispatch:
concurrency:
  group: ordered-patch-series-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check-ready-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed comparison objects
        run: |
          git fetch --no-tags https://github.com/nicoverbruggen/kobalt.git 1796a32559dbb2912bd565990d1c7a0ca7ac4e52 be47258850ffdc3295257475afdf8b8f6cb53176
          git fetch --no-tags origin ca50dd358386e9fccc5122b464f74003caa51e75
      - name: Series validation tests
        run: python3 -m unittest discover -s platforms/patch-series -p 'test_*.py' -v
      - name: Verify ready prefix only (not full-stack acceptance)
        run: python3 platforms/patch-series/apply.py --verify-ready
      - name: Reproduce inventory
        run: |
          python3 platforms/patch-series/inventory.py --output build/patch-inventory
          diff -u doc/reports/patch-series/inventory.tsv build/patch-inventory/inventory.tsv
          diff -u doc/reports/patch-series/summary.json build/patch-inventory/summary.json
  compile-prepared-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk: [linux, qt5]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream and prepare test-only prefix
        run: |
          git fetch --no-tags https://github.com/nicoverbruggen/kobalt.git 1796a32559dbb2912bd565990d1c7a0ca7ac4e52
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'platforms/patch-series')
          from apply import apply_to
          out = Path('build/prepared-prefix').resolve()
          out.mkdir(parents=True)
          data = apply_to(Path.cwd(), Path('platforms/patch-series/series.json'), out, ready_only=True)
          applied = []
          for patch in data['patches']:
              if patch['status'] not in ('ready', 'prepared'):
                  break
              applied.append(patch)
          Path('build/applied-prefix.json').write_text(json.dumps({
              'upstream': data['upstream'], 'policy': 'test-only-prefix-not-full-fork',
              'applied': applied, 'remaining': data['patches'][len(applied):]
          }, indent=2) + '\n')
          assert (out / 'src/publication/fb2_resources.cpp').is_file()
          PY
          cmake -DROOT="$PWD/build/prepared-prefix" -P platforms/control-beta10/validate.cmake
      - name: Compile prepared prefix (not full-stack acceptance)
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          root="$PWD/build/prepared-prefix"
          image=$(sh "$root/platforms/sdk-image.sh" "$SDK")
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/prefix-dependencies"
          log="$RUNNER_TEMP/prefix-build.log"
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e SDK \
            -v "$root:/work" -v "$RUNNER_TEMP/prefix-dependencies:/dependency-cache" \
            -w /work "$image" bash -euc '
              if [[ "$SDK" == linux ]]; then
                cd platforms/desktop
                cmake --preset linux -DKOBALT_DEPENDENCY_CACHE=/dependency-cache -DKOBALT_DEPENDENCY_JOBS=4
                cmake --build --preset linux --parallel 4 --target kobalt-local-resources-tests kobalt-zip-resource-tests kobalt-plain-archive-tests kobalt-fb2-engine-tests kobalt-fb2-cache-session-tests kobalt-nickel-book-menu-tests kobalt-appearance-settings-tests kobalt-comics-layout-tests kobalt-comics-tests kobalt-resource-cache-tests kobalt-comics-ui-tests kobalt-reader-controls-tests kobalt-strings-locale-tests kobalt-debug-language-ui-tests kobalt-columns-tests kobalt-chapter-parity-tests
                for test in local-resources zip-resource plain-archive fb2-engine; do
                  QT_QPA_PLATFORM=offscreen "/work/build/desktop-linux/kobalt-$test-tests"
                done
                QT_QPA_PLATFORM=offscreen ctest --test-dir /work/build/desktop-linux --output-on-failure --no-tests=error -R "^((model|platform)\.(nickel-book-menu|appearance-settings|resource-cache|fb2-cache-session|strings-locale)|engine\.(comics-layout|comics|columns|chapter-parity)|component\.(comics-ui|reader-controls|debug-language-ui))$"
              else
                cd platforms/kobo
                cmake --preset qt5 -DKOBALT_COMMIT=1796a32 -DKOBALT_COMMIT_MODIFIED=ON -DKOBALT_VERBOSE_DIAGNOSTICS=ON -DKOBALT_BUILD_TESTS=ON -DKOBALT_DEPENDENCY_CACHE=/dependency-cache -DKOBALT_DEPENDENCY_JOBS=4
                cmake --build --preset qt5 --parallel 4
                cmake --build --preset qt5 --target check-package kobalt-qt5-refresh-tests
                ctest --test-dir /work/build/kobo-qt5 --output-on-failure --no-tests=error -R "^pewter[.]qt5-refresh$"
              fi
            ' 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" != 0 ]]; then
            message=$(tail -n 18 "$log" | cut -c 1-200)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            echo "::error::$message"
          fi
          exit "$result"
      - name: Collect beta10 prefix device test package
        if: matrix.sdk == 'qt5'
        run: |
          mkdir -p build/prefix-device-artifact
          cp build/prepared-prefix/build/kobo-qt5/Kobalt-qt5-diagnostic.zip build/prefix-device-artifact/Beta10-series-prefix-qt5.zip
          cp build/applied-prefix.json build/prefix-device-artifact/applied-prefix.json
          printf '%s\n' "$GITHUB_SHA" > build/prefix-device-artifact/source-commit.txt
          cp platforms/patch-series/DEVICE-TEST.md build/prefix-device-artifact/README.md
          cd build/prefix-device-artifact
          sha256sum Beta10-series-prefix-qt5.zip > SHA256SUMS
      - name: Upload beta10 prefix (not legacy device build or complete fork)
        if: matrix.sdk == 'qt5'
        uses: actions/upload-artifact@v7
        with:
          name: Beta10-series-prefix-qt5
          path: build/prefix-device-artifact/
          if-no-files-found: error
          retention-days: 14
